<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMind · Talk to any book</title>
    <meta
      name="description"
      content="Upload a book, ask it anything, and get answers that cite the exact page. Summaries, quizzes, character maps and natural read-aloud voices. Free, private, and runs on your own computer."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <!-- Social sharing (Open Graph / Twitter). Once BookMind has a public address, make og:image
         and og:url absolute (https://your.domain/og-image.png): some sites require it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookMind" />
    <meta property="og:title" content="BookMind · Talk to any book" />
    <meta property="og:description" content="Cited answers from your own books, study tools, and natural voices that read them aloud." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BookMind: “Talk to any book.” next to a chat answering a question about Alice in Wonderland, with a citation." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookMind · Talk to any book" />
    <meta name="twitter:description" content="Cited answers from your own books, study tools, and natural voices that read them aloud." />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Installable on phones (Add to Home Screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2553eb" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BookMind" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
